# Measurement Oracle and MinIO. Same images as infra/docker-compose.yml.
# BE and FE are not built. infra/.env and the product data volumes are not used.
services:
  minio:
    image: quay.io/minio/minio
    container_name: measure-minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: measure
      MINIO_ROOT_PASSWORD: measure_local
    command: server /data
    volumes:
      - measure-minio-data:/data

  oracle-db:
    image: gvenzl/oracle-xe:latest
    container_name: measure-oracle
    ports:
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: measure_oracle
      APP_USER: MEASURE
      APP_USER_PASSWORD: measure_local
    volumes:
      - measure-oracle-data:/opt/oracle/oradata
      - ./oracle/init/10-load.sh:/container-entrypoint-initdb.d/10-load.sh:ro
      - ./oracle/sql:/measure-sql:ro
    shm_size: 1gb

volumes:
  measure-oracle-data:
  measure-minio-data:

# .env file 처리 해야함
services:
  minio:
    container_name: review-minio
    image: quay.io/minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - ~/volumes/minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  oracle-db:
    image: gvenzl/oracle-xe:latest
    container_name: review-db
    ports:
      - "1521:1521"
    env_file:
      - .env
    volumes:
      - ~/volumes/oracle-data:/opt/oracle/oradata
    restart: always

  be:
    container_name: review-be
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - minio
      - oracle-db
    restart: always

  fe:
    container_name: review-fe
    build:
      context: ../View
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
    ports:
      - "3000:80"
    depends_on:
      - be
    restart: always

  review-test-db:
    image: gvenzl/oracle-xe:latest
    container_name: review-test-db
    ports:
      - "1522:1521"
    env_file:
      - .env.test
    environment:
      ORACLE_DATABASE: REVIEWTEST
      APP_USER: REVIEW_TEST
    volumes:
      - ~/volumes/oracle-test-data:/opt/oracle/oradata
      - ../src/test/resources/db/schema.sql:/container-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "REVIEWTEST"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: "no"
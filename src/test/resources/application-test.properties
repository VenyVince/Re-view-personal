spring.application.name=Re_View
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Test Oracle only. Missing variables fail startup and do not fall back to the dev database.
spring.datasource.url=${TEST_DATASOURCE_URL}
spring.datasource.username=${TEST_DATASOURCE_USERNAME}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.cache-enabled=true
mybatis.configuration.default-executor-type=reuse

mybatis.type-aliases-package=com.review.shop.dto

logging.level.root=INFO
logging.level.com.review.shop=INFO

# Not the development MinIO. The client is built at startup and is not called by contextLoads.
minio.url=http://127.0.0.1:9
minio.root-user=test
minio.root-password=test
minio.bucket=test
